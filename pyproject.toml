[project]
name = "oldman-ops-demo"
version = "0.1.0"
description = "A server maintenance tool built on Oldman: terminal menus, ops primitives and remote files."
requires-python = ">=3.12"
dependencies = [
    "oldman>=0.4.1,<0.5.0",
]

[tool.oldman]
project_id = "554f6f76-c17c-4f5e-aa5a-a8c42a0ed3a2"

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 150
exclude = [".git", ".ruff_cache", "__pycache__", ".venv", "var"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
